# Pages CMS 配置 · Firefly 博客
# 文档：https://pagescms.org/docs
# 用法：本文件位于仓库根目录，在 pagescms.org 用 GitHub 登录并授权本仓库后即可使用可视化后台。

# ============================================================
# 全局设置
# ============================================================
settings:
  content:
    # 保存时把表单字段合并进原文件，保留配置中未声明的 frontmatter 键
    # （例如文章的 prevTitle/prevSlug 内部字段），务必开启
    merge: true

# ============================================================
# 媒体库
# ============================================================
media:
  - name: post-images
    label: 文章配图
    description: 文章封面与正文插图，存放于 public/assets/images
    input: public/assets/images
    output: /assets/images
    extensions: [jpg, jpeg, png, webp, avif, gif, svg]
    rename: safe

  - name: music
    label: 音乐
    description: 音乐播放器曲目，存放于 public/assets/music
    input: public/assets/music
    output: /assets/music
    categories: [audio]
    rename: safe

  - name: site-assets
    label: 站点资源
    description: 站点其他静态资源，存放于 public/assets
    input: public/assets
    output: /assets
    rename: safe

# ============================================================
# 内容
# ============================================================
content:
  # ----------------------------------------------------------
  # 内容管理
  # ----------------------------------------------------------
  - name: main
    label: 内容管理
    type: group
    items:
      # 文章 src/content/posts
      - name: posts
        label: 文章
        description: 文件名决定文章链接（/posts/文件名/），中文标题请手动填写英文或拼音文件名
        type: collection
        path: src/content/posts
        format: yaml-frontmatter
        filename:
          template: "{primary}.md"
          # 文件名可编辑：中文标题无法自动生成文件名，需手动填写
          field: true
        view:
          layout: tree
          fields: [title, published, category, draft, pinned]
          primary: title
          sort: [published, title]
          default:
            sort: published
            order: desc
        fields:
          - name: title
            label: 标题
            type: string
            required: true
          - name: published
            label: 发布日期
            type: date
            required: true
          - name: updated
            label: 更新日期
            type: date
          - name: draft
            label: 草稿
            type: boolean
            default: false
          - name: pinned
            label: 置顶
            type: boolean
            default: false
          - name: order
            label: 排序权重
            type: number
            description: 数字越大越靠前；留空则按发布日期排列（置顶优先于本字段）
          - name: description
            label: 摘要
            type: text
            description: 文章列表与 SEO 使用的简短描述
          - name: image
            label: 封面图
            type: image
            description: 留空使用默认封面；填 api 使用随机封面（需在 coverImageConfig.ts 开启）
            options:
              media: post-images
          - name: tags
            label: 标签
            type: string
            list: true
          - name: category
            label: 分类
            type: string
          - name: lang
            label: 语言
            type: string
            description: 例如 zh_CN、en，留空使用站点默认
          - name: author
            label: 作者
            type: string
          - name: series
            label: 系列
            type: string
          - name: seriesOrder
            label: 系列序号
            type: number
          - name: comment
            label: 允许评论
            type: boolean
            default: true
          - name: password
            label: 访问密码
            type: string
            description: 设置后文章需输入密码才能查看
          - name: passwordHint
            label: 密码提示
            type: string
          - name: sourceLink
            label: 原文链接
            type: string
          - name: licenseName
            label: 许可证名称
            type: string
          - name: licenseUrl
            label: 许可证链接
            type: string
          - name: body
            label: 正文
            type: code
            options:
              format: md

      # 动态 src/content/dynamic
      - name: dynamic
        label: 动态
        type: collection
        path: src/content/dynamic
        format: yaml-frontmatter
        filename:
          template: "{year}-{month}-{day}-{hour}{minute}{second}.md"
        view:
          layout: list
          fields: [published, location, pinned]
          primary: published
          sort: [published]
          default:
            sort: published
            order: desc
        fields:
          - name: published
            label: 发布时间
            type: date
            required: true
            # 秒级精度：Firefly 动态按此格式解析时间
            options:
              time: true
              format: "yyyy-MM-dd HH:mm:ss"
          - name: pinned
            label: 置顶
            type: boolean
            default: false
          - name: location
            label: 位置
            type: string
          - name: body
            label: 内容
            type: code
            options:
              format: md

      # 项目 src/content/projects
      - name: projects
        label: 项目
        description: 文件名决定项目链接（/projects/文件名/）
        type: collection
        path: src/content/projects
        format: yaml-frontmatter
        filename:
          template: "{primary}.md"
          field: true
        view:
          layout: list
          fields: [title, status, order, published]
          primary: title
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: 项目名
            type: string
            required: true
          - name: published
            label: 发布日期
            type: date
            required: true
          - name: draft
            label: 草稿
            type: boolean
            default: false
          - name: order
            label: 排序
            type: number
            description: 数字越小越靠前
          - name: description
            label: 描述
            type: text
          - name: image
            label: 封面图
            type: image
            options:
              media: post-images
          - name: tags
            label: 标签
            type: string
            list: true
          - name: status
            label: 状态
            type: string
            description: 例如 published、developing
          - name: lang
            label: 语言
            type: string
          - name: link
            label: 相关链接
            type: object
            list: true
            fields:
              - name: label
                label: 链接名称
                type: string
              - name: icon
                label: 图标
                type: string
                description: Iconify 图标名，例如 fa7-brands:github
              - name: value
                label: 链接地址
                type: string
          - name: body
            label: 项目说明
            type: code
            options:
              format: md

  # ----------------------------------------------------------
  # 单页
  # ----------------------------------------------------------
  - name: pages
    label: 单页
    type: group
    items:
      # 关于页 src/content/spec/about.md（纯 Markdown，无 frontmatter）
      # 用 raw 格式：保存时原样写回正文，不会插入多余的 --- 分隔符
      - name: about
        label: 关于页
        type: file
        path: src/content/spec/about.md
        format: raw
        fields:
          - name: body
            label: 正文
            type: code
            options:
              format: md

      # 系列展示顺序 src/data/series-order.json
      # 直接用鼠标拖拽调整上下顺序；数组越靠前，/series/ 页显示越靠前
      # 未列出的系列会自动排在后面（按文章数降序）
      - name: series-order
        label: 系列顺序
        description: 拖拽调整系列在 /series/ 页面的展示顺序
        type: file
        path: src/data/series-order.json
        format: json
        list: true
        fields:
          - name: series
            label: 系列名称
            type: string
            description: 必须与文章的「系列」字段完全一致
